name: Import reviewed trusted-device source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'voxibanez/iloader-trusted-device' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the destination branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and import the reviewed source
        shell: bash
        run: |
          set -euo pipefail
          echo '2f8d7c656cb72d885a56bb6b9c38293f42e6613387a431ee335b651594fc4e5d  trusted-device-source.patch' | sha256sum --check --strict
          git diff --exit-code 902597564315442f00ab299dcc758ee0e13b8fa8 HEAD -- . ':!.github/workflows' ':!trusted-device-source.patch'
          git apply --check --index trusted-device-source.patch
          git apply --index trusted-device-source.patch
          git rm trusted-device-source.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use trusted-device authentication exclusively in personal fork'
          git push origin HEAD:main
          echo 'Reviewed source imported. Run the trusted-device macOS build from the main branch.' >> "$GITHUB_STEP_SUMMARY"
